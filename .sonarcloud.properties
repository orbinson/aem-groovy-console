# Third-party assets vendored into the classic console's Composum clientlib.
# They are shipped verbatim from upstream and are not ours to fix, so analysing
# them only produces findings we would have to permanently ignore. Everything we
# actually wrote in that clientlib (console.js, audit.js, scheduled-jobs.js,
# local-storage.js, services.js, console.css) stays in scope.
#
# Ace editor (ace.js and its modes/themes/workers/extensions), DataTables,
# Bootstrap 3, jQuery UI, Moment.js, Modernizr, daterangepicker, bootstrap3-typeahead.

sonar.exclusions=\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/ace.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/ext-*.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/mode-*.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/theme-*.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/worker-*.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/bootstrap3-typeahead.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/datatables.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/daterangepicker.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/jquery-ui.min.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/modernizr.custom.*.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/js/moment.min.js,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/css/bootstrap.css,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/css/bootstrap-theme.css,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/css/datatables.css,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/css/daterangepicker.css,\
  ui.apps/src/main/content/jcr_root/apps/groovyconsole/clientlibs/css/daterangepicker-bs3.css
