name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 25]

    name: Build (Java ${{ matrix.java-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.java-version }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.java-version }}-
            ${{ runner.os }}-maven-

      - name: Build
        run: mvn --batch-mode --update-snapshots install

      - name: Integration tests
        run: mvn --batch-mode verify -pl it.tests -Pit

      # Save logs only if the job fails
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-java-${{ matrix.java-version }}
          path: it.tests/target/launchers/model/logs/*
